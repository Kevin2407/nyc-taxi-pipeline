# Proyecto dbt del pipeline NYC Taxi.
# dbt no procesa datos por su cuenta: arma el SQL de cada modelo y se lo manda a
# Postgres en el orden que surge de los ref() entre modelos.
#
# Dónde está cada cosa (respetando la estructura de la consigna):
#   sql/        un archivo SQL por modelo: staging, calidad, curado, modelo y preguntas
#   contracts/  reglas_calidad.csv (seed: severidad, umbral y justificación de cada regla)
#   tests/dbt/  tests de datos de dbt (reconciliación y otros)
#   macros/     funciones de Jinja que usan los modelos
#
# Uso (desde el contenedor):  dbt build      (seeds, modelos y tests, en orden)

name: taxi
version: "2.0.0"
config-version: 2
profile: taxi

model-paths: ["sql"]
seed-paths: ["contracts"]
test-paths: ["tests/dbt"]
macro-paths: ["macros"]
analysis-paths: []
snapshot-paths: []

# Umbrales de las reglas de calidad. Cambiar un número acá cambia la regla, sin tocar SQL.
vars:
  distancia_maxima_millas: 100   # R04
  velocidad_maxima_mph: 80       # R10
  # El mes asignado sale de la variable de entorno MES (docker-compose / .env).
  # Para otro mes sin tocar nada:  dbt build --vars '{mes: 2025-04}'

models:
  taxi:
    staging:
      +schema: staging          # vistas livianas sobre raw
      +materialized: view
    calidad:
      +schema: calidad          # tablas: reglas, válidos, cuarentena y reportes
      +materialized: table
    curado:
      +schema: curado           # viajes válidos con columnas derivadas y zonas
      +materialized: table
    modelo:
      +schema: modelo           # modelo estrella y tabla agregada
      +materialized: table
    preguntas:
      +schema: preguntas        # una tabla por pregunta de negocio
      +materialized: table

seeds:
  taxi:
    +schema: calidad
